name: upstream-drift
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/upstream_monitor.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-check-${{ github.run_id }}
          path: artifacts/upstream-checks/
          if-no-files-found: error
          retention-days: 30
