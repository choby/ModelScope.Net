apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modelscope-worker-default-deny
  namespace: modelscope-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: modelscope-python-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modelscope-worker-allow-gateway-mtls
  namespace: modelscope-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: modelscope-python-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: modelscope-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: modelscope-net-gateway
      ports:
        - protocol: TCP
          port: 50051
