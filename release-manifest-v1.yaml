notes:
  - This draft contains 15 fixed-revision representatives: the original public contract/five-model native set, five P5 extensions, and four metadata-verified engineering candidates.
  - Five fixed-Revision local inference models now pass the P3-07 engineering certification gate; release approval remains pending.
  - P3-08 macOS ARM64 CPU performance gates passed across two repeated runs; unmeasured platforms and accelerators remain fail-closed.
  - P4-04 application resource governance passed; P4-05 now supplies the mandatory OS and container quota profile.
  - P4-05 container controls and real worker mTLS passed; target-cluster enforcement and soak evidence remain pending P4-07.
  - MobileNet V2 source metadata declares license `other`; legal approval is required before a production release.
  - The Qwen GGUF entry is inference-certified only for llama.cpp b10516 on macOS ARM64 CPU; pinned Ubuntu and Windows assets are not yet executed.
  - The engineering draft now meets the 15-model count and includes remote multimodal, trust_remote_code, GGUF embedding and ONNX object-detection candidates; business owners must approve the set and provide an authorized private/restricted repository before phase 0 can close.
